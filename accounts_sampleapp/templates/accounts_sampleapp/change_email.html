<!DOCTYPE html>
<html lang="ja">
{% load static %}   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メールアドレス変更画面</title>
    <link rel="stylesheet" href="{% static "accounts_sampleapp/css/change_email.css" %}">
</head>
<body>

    <!-- タイトル -->
    <h1>メールアドレス変更</h1>

    <!-- フォーム開始 -->
    <form method="POST">
        {% csrf_token %}

        <!-- 新しいユーザー名 -->
        <label for="{{ form.email.id_for_label }}">新しいメールアドレス</label><br>
        {{ form.email }}

        <!-- エラーメッセージ -->
        {% if form.email.errors %}
            <div>
                {% for error in form.email.errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <!-- 変更ボタン -->
        <button type="submit">変更</button>
    </form>
    
</body>
</html>
